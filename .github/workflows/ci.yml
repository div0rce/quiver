# Quiver CI — M1 gate set (MOD-CI).
# REQ-CI-001 (SHA-pinned actions), REQ-CI-002/-003 (build/test matrix, sanitizers, TSan, tidy),
# REQ-CI-010..012. SDE/fuzz/bench-smoke/nightly jobs activate at their owning milestones
# (docs/prd/13-ci-architecture.md, docs/prd/18-milestones.md).
#
# Action pin registry (REQ-SEC-006; verified against upstream tags):
#   actions/checkout v4.2.2 = 11bd71901bbe5b1630ceea73d27597364c9af683

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:  # invoked as the gate set by release.yml (REQ-CI-009)

permissions:
  contents: read  # REQ-SEC-008: minimal default

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLANG_FORMAT: clang-format-18  # pinned major version, REQ-STD-002
  CLANG_TIDY: clang-tidy-18      # pinned major version, REQ-STD-007 / REQ-TEST-010

jobs:
  repo-lint:
    name: repo lint (tree manifest, ADR set, source scans)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run repository lint
        run: python3 .github/scripts/repo_lint.py

  format-check:
    name: clang-format (pinned major 18)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned clang-format
        run: sudo apt-get update -q && sudo apt-get install -y -q clang-format-18
      - name: Check formatting of all C++ sources
        run: |
          set -eu
          files=$(git ls-files '*.h' '*.hpp' '*.cpp' '*.cc' || true)
          if [ -z "$files" ]; then
            echo "format-check: no C++ sources — trivially clean"
            exit 0
          fi
          echo "$files" | xargs ${CLANG_FORMAT} --dry-run --Werror

  docs-build:
    name: docs build (mkdocs --strict)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned docs toolchain
        run: python3 -m pip install -r docs/requirements.txt
      - name: Build documentation site (strict; broken links fail, REQ-DOC-005)
        run: mkdocs build --strict -f docs/mkdocs.yml

  configure-check:
    name: cmake presets configure (REQ-BUILD-011)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        preset: [dev, release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}

  build-test:
    name: build+test (${{ matrix.os }}, ${{ matrix.compiler }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # REQ-CI-003: ubuntu x86-64 — two GCC + two Clang versions, dev + werror-release
          - { os: ubuntu-24.04, compiler: gcc-13,   cc: gcc-13,   cxx: g++-13,     preset: dev }
          - { os: ubuntu-24.04, compiler: gcc-13,   cc: gcc-13,   cxx: g++-13,     preset: ci-gcc }
          - { os: ubuntu-24.04, compiler: gcc-14,   cc: gcc-14,   cxx: g++-14,     preset: dev }
          - { os: ubuntu-24.04, compiler: gcc-14,   cc: gcc-14,   cxx: g++-14,     preset: ci-gcc }
          - { os: ubuntu-24.04, compiler: clang-17, cc: clang-17, cxx: clang++-17, preset: dev }
          - { os: ubuntu-24.04, compiler: clang-17, cc: clang-17, cxx: clang++-17, preset: ci-clang }
          - { os: ubuntu-24.04, compiler: clang-19, cc: clang-19, cxx: clang++-19, preset: dev }
          - { os: ubuntu-24.04, compiler: clang-19, cc: clang-19, cxx: clang++-19, preset: ci-clang }
          # REQ-CI-003: ubuntu ARM64 (NEON platform from M5; framework coverage from M1)
          - { os: ubuntu-24.04-arm, compiler: gcc-14,   cc: gcc-14,   cxx: g++-14,     preset: dev }
          - { os: ubuntu-24.04-arm, compiler: gcc-14,   cc: gcc-14,   cxx: g++-14,     preset: ci-gcc }
          - { os: ubuntu-24.04-arm, compiler: clang-19, cc: clang-19, cxx: clang++-19, preset: dev }
          - { os: ubuntu-24.04-arm, compiler: clang-19, cc: clang-19, cxx: clang++-19, preset: ci-clang }
          # REQ-CI-003: macOS AppleClang
          - { os: macos-15, compiler: appleclang, cc: cc, cxx: c++, preset: dev }
          - { os: macos-15, compiler: appleclang, cc: cc, cxx: c++, preset: release }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          case "${{ matrix.compiler }}" in
            gcc-14)
              command -v g++-14 >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q gcc-14 g++-14; } ;;
            clang-17|clang-19)
              v="${{ matrix.compiler }}"; v="${v#clang-}"
              command -v "clang-$v" >/dev/null || { wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh && sudo bash /tmp/llvm.sh "$v"; }
              # clang-17 predates libstdc++-14's C++23 <tuple>; pair it with the image's
              # gcc-13 standard library (toolchain selection, same class as $CC/$CXX).
              if [ "$v" = "17" ]; then
                echo "CXXFLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13" >> "$GITHUB_ENV"
              fi ;;
            *) ;;
          esac
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j 4
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  consumption:
    # REQ-BUILD-010 / REQ-CI-008: consume the installed package two ways — find_package(CONFIG)
    # against the install tree (mode a) and FetchContent from source (mode b). The amalgamation
    # single-file mode (c) is verified by its own job once amalgamate.py lands. Uses each runner's
    # default compiler; cxx_std_23 is a PUBLIC usage requirement so consumers inherit the standard.
    name: consumption (find_package + FetchContent; REQ-BUILD-010)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build + install, then consume both ways
        run: |
          set -eu
          SRC="$PWD"
          cmake -S "$SRC" -B build/pkg -DCMAKE_BUILD_TYPE=Release -DQUIVER_ENABLE_TESTS=OFF
          cmake --build build/pkg -j 4
          cmake --install build/pkg --prefix "$SRC/_prefix"
          # Installed tree must carry only headers, the archive, and the CMake package (REQ-REPO-007).
          test -f "$SRC/_prefix/include/quiver/quiver.h"
          test -f "$SRC/_prefix/lib/cmake/Quiver/QuiverConfig.cmake"
          mkdir -p _consumer
          cat > _consumer/main.cpp <<'CPP'
          #include "quiver/quiver.h"
          #include <cstdint>
          #include <cstdio>
          int main() {
            const int v[] = {1, 9, 3, 7};
            std::uint8_t bits[1] = {0};
            const auto c = quiver::compare_bitmap(quiver::CompareOp::kGt, quiver::BatchView<int>{v, 4},
                                                  4, quiver::BitmapView{nullptr}, bits);
            std::printf("kept=%lld isa=%d\n", (long long)c, (int)quiver::active_isa());
            return c == 2 ? 0 : 1;
          }
          CPP
          echo "== mode (a): find_package(CONFIG) =="
          cat > _consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.28)
          project(consumer_find_package CXX)
          find_package(Quiver CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE quiver::quiver)
          CMAKE
          cmake -S _consumer -B build/consume-fp -DCMAKE_PREFIX_PATH="$SRC/_prefix"
          cmake --build build/consume-fp -j 4
          ./build/consume-fp/consumer
          echo "== mode (b): FetchContent(SOURCE_DIR) =="
          cat > _consumer/CMakeLists.txt <<CMAKE
          cmake_minimum_required(VERSION 3.28)
          project(consumer_fetchcontent CXX)
          include(FetchContent)
          FetchContent_Declare(Quiver SOURCE_DIR "$SRC")
          FetchContent_MakeAvailable(Quiver)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE quiver::quiver)
          CMAKE
          cmake -S _consumer -B build/consume-fc
          cmake --build build/consume-fc -j 4
          ./build/consume-fc/consumer

  amalgamation:
    # REQ-BUILD-013 / REQ-INT-005 / REQ-STD-006 / REQ-BUILD-010 mode (c): lint the source
    # amalgamation-compatibility rules, compile the generated single-file pair and run the unit
    # suite against it (byte-identical kernel outputs), and prove the two-file drop-in builds with
    # one compiler command. GCC/Clang only here; the MSVC narrowing path is a separate leg.
    name: amalgamation (verify + drop-in; REQ-BUILD-013)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned clang
        run: sudo apt-get update -q && sudo apt-get install -y -q clang-18
      - name: "REQ-STD-006: amalgamation-compatibility lint"
        run: python3 tools/amalgamate/amalgamate.py --check
      - name: "Verify: compile the pair + run the unit suite against it (WERROR)"
        env: { CC: clang-18, CXX: clang++-18 }
        run: |
          set -eu
          cmake --preset dev -DQUIVER_ENABLE_WERROR=ON
          cmake --build --preset dev --target quiver_tests_unit_amalgamated -j 4
          ctest --preset dev --output-on-failure -R '^(Amalgamated|Amalgamate)\.'
      - name: "Mode (c): two-file drop-in builds with a single compiler command"
        run: |
          set -eu
          python3 tools/amalgamate/amalgamate.py --out-dir amalg
          cat > consumer.cpp <<'CPP'
          #include "quiver.h"
          #include <cstdint>
          #include <cstdio>
          int main() {
            const int v[] = {1, 9, 3, 7, 2, 8};
            std::uint8_t bits[1] = {0};
            const auto c = quiver::compare_bitmap(quiver::CompareOp::kGt, quiver::BatchView<int>{v, 6},
                                                  4, quiver::BitmapView{nullptr}, bits);
            std::printf("drop-in kept=%lld isa=%d\n", (long long)c, (int)quiver::active_isa());
            return c == 3 ? 0 : 1;
          }
          CPP
          clang++-18 -std=c++23 -Iamalg amalg/quiver.cpp consumer.cpp -o demo
          ./demo
      - name: "-fno-exceptions consumer builds + runs (REQ-ERR acceptance)"
        run: |
          set -eu
          # The library is all-noexcept / -fno-exceptions -fno-rtti; an exception-free consumer
          # must build and link against it. Reuse the drop-in pair as the smallest such consumer.
          clang++-18 -std=c++23 -fno-exceptions -fno-rtti -Iamalg amalg/quiver.cpp consumer.cpp \
            -o demo_noexc
          ./demo_noexc

  msvc:
    # REQ-BUILD-010 Windows leg. Builds the FULL test suite (not just the amalgamated unit
    # target) and runs it with NO --gtest_filter exclusions: both former R-18 deviations are
    # fixed at the source rather than filtered —
    #  - reduce_sum_checked now accumulates exactly on toolchains without __int128
    #    (reduce_scalar_impl.h), so API-K6-003 holds on MSVC;
    #  - GuardedAlloc's Windows branch is implemented with VirtualAlloc/VirtualProtect
    #    (tests/testkit/generators.cpp) instead of returning nullptr.
    # The amalgamation leg still runs separately below, on the DEFAULT /arch (SSE2 baseline —
    # baseline-safe by construction: MSVC self-contains AVX2/AVX-512 intrinsics at their call
    # sites, so nothing leaks into the scalar/dispatch path). See docs/adr/ADR-018.
    name: MSVC full suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DQUIVER_ENABLE_TESTS=ON
      - name: Build every test target
        run: cmake --build build --config Debug -j 4
      - name: Run the full suite (no exclusions)
        run: ctest --test-dir build -C Debug -j 4 --output-on-failure

  msvc-amalgamation:
    name: MSVC amalgamation (ADR-018)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure (default VS generator, default /arch)
        run: cmake -S . -B build -DQUIVER_ENABLE_TESTS=ON
      - name: Build the amalgamated verify target (generate + compile the pair)
        run: cmake --build build --config Debug --target quiver_tests_unit_amalgamated
      - name: Run the unit suite against the amalgamation
        shell: bash
        run: |
          set -eu
          exe=$(find build -name quiver_tests_unit_amalgamated.exe | head -1)
          echo "running $exe"
          "$exe"

  pinned-build:
    # REQ-DISP-013 / REQ-CI-008: a compile-time-pinned build (QUIVER_PIN_ISA=avx2) on an x86
    # runner statically resolves every entry to AVX2 — build it, run the unit suite (the
    # runtime-dispatch-policy cases self-skip under a pin), and assert active_isa() == avx2.
    name: pinned build (QUIVER_PIN_ISA=avx2; REQ-DISP-013)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned clang
        run: sudo apt-get update -q && sudo apt-get install -y -q clang-18
      - name: Build the pinned library, unit suite, and ISA example
        env: { CC: clang-18, CXX: clang++-18 }
        run: |
          set -eu
          cmake -S . -B build/pin -DQUIVER_PIN_ISA=avx2 -DQUIVER_ENABLE_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug -DQUIVER_ENABLE_ASSERTS=ON
          cmake --build build/pin --target quiver_tests_unit quiver_example_03_isa_override -j 4
      - name: Unit suite passes under the pin
        run: ctest --test-dir build/pin --output-on-failure -R '^Dispatch'
      - name: "active_isa() resolves to the pinned tier (avx2)"
        run: |
          set -eu
          out=$(./build/pin/bin/quiver_example_03_isa_override)
          echo "$out"
          echo "$out" | grep -q "default active ISA: avx2"

  asan-ubsan:
    name: sanitizers (ASan+UBSan, clang)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure
        env: { CC: clang-18, CXX: clang++-18 }
        run: cmake --preset asan-ubsan
      - name: Build
        run: cmake --build --preset asan-ubsan -j 4
      - name: Test
        run: ctest --preset asan-ubsan --output-on-failure

  tsan:
    name: sanitizers (TSan, dispatch protocol)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure
        env: { CC: clang-18, CXX: clang++-18 }
        run: cmake --preset tsan
      - name: Build
        run: cmake --build --preset tsan -j 4
      - name: Test
        run: ctest --preset tsan --output-on-failure

  sde-avx512:
    name: SDE AVX-512 (correctness, -spr + -skx; REQ-CI-004)
    runs-on: ubuntu-24.04
    env:
      # Pinned Intel SDE (REQ-CI-011: cached, keyed by version; ADR-010; risk R-04).
      SDE_VERSION: "9.53.0-2025-03-16"
      SDE_URL: "https://downloadmirror.intel.com/850782/sde-external-9.53.0-2025-03-16-lin.tar.xz"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned clang
        run: sudo apt-get update -q && sudo apt-get install -y -q clang-18
      - name: Cache Intel SDE
        id: sde-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: sde
          key: sde-${{ env.SDE_VERSION }}
      - name: Download Intel SDE (cache miss only)
        if: steps.sde-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          curl -fsSL "$SDE_URL" -o sde.tar.xz
          mkdir -p sde && tar xf sde.tar.xz -C sde --strip-components=1
      - name: Build release + asan-ubsan presets
        env: { CC: clang-18, CXX: clang++-18 }
        run: |
          set -eu
          cmake --preset release && cmake --build --preset release -j 4
          cmake --preset asan-ubsan && cmake --build --preset asan-ubsan -j 4
      # Leg (a): unit + differential + invariant under -spr (F+BW+DQ+VL+VBMI2) and -skx (VBMI2
      # absent — exercises the REQ-DISP-011 fallback). Release preset → asserts off → death tests
      # self-skip (REQ-TEST-014). The differential suite auto-covers the AVX-512 backends because
      # SDE reports real AVX-512 CPUID, so dispatch resolves slot [3].
      - name: "Leg (a): release suites under SDE -spr and -skx"
        run: |
          set -eu
          SDE=sde/sde64
          for prof in -spr -skx; do
            echo "== SDE $prof =="
            for suite in unit differential invariant; do
              "$SDE" "$prof" -- ./build/release/tests/quiver_tests_$suite --gtest_brief=1
            done
          done
      # Leg (b): Clang ASan+UBSan differential under -spr — discharges REQ-SIMD-003's sanitized
      # masked-tail validation (ASan instruments the masked-load/store lowering). Only the
      # differential suite runs here: it is the sanitized coverage leg (b) uniquely provides, and
      # it is fork-free. The unit and invariant suites get full SDE coverage in leg (a); running
      # them under ASan+SDE adds no unique coverage but hangs — their death-test / guard-page
      # forks do not terminate under Pin-style emulation (observed: a 6 h orphan-process cancel).
      - name: "Leg (b): sanitized differential under SDE -spr (REQ-SIMD-003)"
        run: |
          set -eu
          SDE=sde/sde64
          "$SDE" -spr -- ./build/asan-ubsan/tests/quiver_tests_differential --gtest_brief=1

  clang-tidy:
    name: clang-tidy (pinned major 18, REQ-TEST-010)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned clang-tidy
        run: sudo apt-get update -q && sudo apt-get install -y -q clang-tidy-18
      - name: Configure (compile commands)
        env: { CC: clang-18, CXX: clang++-18 }
        run: cmake --preset dev
      - name: Run clang-tidy over shipped library sources
        run: |
          set -eu
          ${CLANG_TIDY} -p build/dev --warnings-as-errors='*' \
            $(git ls-files 'src/*.cpp')

  bench-smoke:
    name: bench smoke (harness pipeline + validation abort, REQ-CI-007)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure bench preset
        run: cmake --preset bench
      - name: Build
        run: cmake --build --preset bench -j 4
      - name: Run every bench binary (validation must pass; no timing gates in CI)
        run: |
          set -eu
          for b in build/bench/bin/quiver_bench_*; do
            echo "== $b"
            "$b" --benchmark_min_time=0.01s
          done
      - name: Negative demo — corrupted validation must abort (REQ-BENCH-004)
        run: |
          set -eu
          if build/bench/bin/quiver_bench_smoke --quiver_validate_fail; then
            echo "::error::bench binary emitted output despite failed validation"
            exit 1
          fi
          echo "validation abort path confirmed (non-zero exit)"

  fuzz-smoke:
    name: fuzz smoke (differential libFuzzer, >=30 s/family, REQ-CI-005/REQ-TEST-007)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure fuzz preset
        env: { CC: clang-18, CXX: clang++-18 }
        run: cmake --preset fuzz
      - name: Build fuzz targets
        run: cmake --build --preset fuzz -j 4
      - name: Run each family target on its committed corpus, then 30 s of exploration
        run: |
          set -eu
          for fam in compare filter select mask take reduce; do
            echo "== quiver_fuzz_${fam}"
            build/fuzz/tests/quiver_fuzz_${fam} -runs=0 "tests/fuzz/corpus/${fam}"
            build/fuzz/tests/quiver_fuzz_${fam} -max_total_time=30 -print_final_stats=1 \
              "tests/fuzz/corpus/${fam}"
          done
      - name: Upload crash artifacts if any
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*
          if-no-files-found: ignore

  dco-check:
    name: DCO sign-off (REQ-STD-009)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Signed-off-by on every commit in the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          bad=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $sha lacks a DCO Signed-off-by trailer (git commit -s)"
              bad=1
            fi
          done
          exit $bad
