# Documentation site deployment (MOD-CI) — builds the MkDocs site with --strict and publishes it
# to GitHub Pages on every push to main. The strict build is the same gate ci.yml runs on PRs;
# this workflow only adds the deployment. Action pins per REQ-CI-001/REQ-SEC-006.

name: docs-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install documentation toolchain (pinned per ADR-019)
        run: python3 -m pip install -r docs/requirements.txt
      - name: Build (strict)
        env:
          QUIVER_DOCS_SITE_URL: "https://div0rce.github.io/quiver/"
        run: mkdocs build --strict -f docs/mkdocs.yml
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
