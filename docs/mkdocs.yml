# Quiver documentation site — ADR-019, REQ-DOC-005 (docs/prd/14-documentation.md).
# Built with `mkdocs build --strict -f docs/mkdocs.yml`; broken links fail CI.
# Navigation grows per milestone as pages come into existence; the target navigation
# is PRD 14 §3. Pages not yet in nav remain reachable via directory README links.

site_name: Quiver
site_description: >-
  Dependency-free C++23 vectorized analytical kernels with a reproducible
  cross-ISA performance ledger.
site_url: !ENV [QUIVER_DOCS_SITE_URL, "https://example.invalid/quiver/"]
repo_url: !ENV [QUIVER_DOCS_REPO_URL, "https://github.com/div0rce/quiver"]

docs_dir: .
site_dir: ../site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: black

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  # REQ-DOC-006: C++ snippets in docs are extracted from tests/ or examples/, never free-typed.
  - pymdownx.snippets:
      base_path: ["..", "."]
      check_paths: true

exclude_docs: |
  mkdocs.yml
  requirements.txt

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn
  anchors: info

nav:
  - Home: README.md
  - Guides:
      - Getting started: guides/getting-started.md
      - Building: guides/building.md
      - Vendoring: guides/vendoring.md
      - Disputing a ledger number: guides/disputes.md
      - Documentation style guide: style/documentation-style-guide.md
  - API reference:
      - Core types: api/core.md
      - Dispatch: api/dispatch.md
      - K1 compare: api/compare.md
      - K2 filter: api/filter.md
      - K3 sel_convert: api/select.md
      - K4 mask_algebra: api/mask.md
      - K5 take / dict_decode: api/take.md
      - K6 reduce / SMA: api/reduce.md
      - K7 hash: api/hash.md
      - K8 unpack: api/unpack.md
      - K9 / K10 arith: api/arith.md
  - Architecture:
      - Module map: architecture/module-map.md
      - Core (MOD-CORE): architecture/core.md
      - Dispatch (MOD-DISPATCH): architecture/dispatch.md
      - Overview: architecture/README.md
  - Benchmarks:
      - Methodology (QLM-1): benchmarks/methodology.md
      - Running benchmarks: benchmarks/running.md
      - Hardware coverage plan (R-06): benchmarks/hardware-coverage-plan.md
      - Overview: benchmarks/README.md
  - Testing:
      - Testkit: testing/testkit.md
      - Differential fuzzing: testing/fuzzing.md
      - Overview: testing/README.md
  - Internals:
      - CPU detection: internals/cpu-detection.md
      - Dispatch state machine: internals/dispatch-state-machine.md
      - Kernel common (MOD-KCOMMON): internals/kernel-common.md
      - Coding standards: internals/coding-standards.md
  - Investigations:
      - K5 gather vs scalar (AVX2): investigations/k5-gather-avx2.md
      - K7 NEON hash vs GPR chain: investigations/k7-neon-hash.md
      - Representation study:
          - Overview: benchmarks/investigations/representation-study/README.md
          - Question: benchmarks/investigations/representation-study/question.md
          - Method: benchmarks/investigations/representation-study/method.md
          - Data: benchmarks/investigations/representation-study/entries.md
          - Analysis: benchmarks/investigations/representation-study/analysis.md
          - Conclusion: benchmarks/investigations/representation-study/conclusion.md
  - ADRs: adr/README.md
  - Specifications:
      - Design Charter: design/DESIGN_CHARTER.md
      - Engineering PRD: prd/README.md
  - Releases:
      - Overview: releases/README.md
      - Gate M0: releases/gates/M0.md
      - Gate M1: releases/gates/M1.md
      - Gate M2: releases/gates/M2.md
      - Gate M3: releases/gates/M3.md
      - Gate M4: releases/gates/M4.md
      - Gate M5: releases/gates/M5.md
      - Gate M6: releases/gates/M6.md
      - Gate M7: releases/gates/M7.md
      - Gate M8: releases/gates/M8.md
      - Gate M9: releases/gates/M9.md
      - Gate M10: releases/gates/M10.md
      - Final implementation report: releases/final-implementation-report.md
      - v0.1.0: releases/v0.1.0.md
      - v0.2.0: releases/v0.2.0.md
      - v0.3.0: releases/v0.3.0.md
      - v0.4.0: releases/v0.4.0.md
      - v0.5.0: releases/v0.5.0.md
      - v0.6.0: releases/v0.6.0.md
