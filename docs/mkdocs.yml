# Quiver documentation site — ADR-019, REQ-DOC-005 (docs/prd/14-documentation.md).
# Built with `mkdocs build --strict -f docs/mkdocs.yml`; broken links fail CI.
# Navigation grows per milestone as pages come into existence; the target navigation
# is PRD 14 §3. Pages not yet in nav remain reachable via directory README links.

site_name: Quiver
site_description: >-
  Dependency-free C++23 vectorized analytical kernels with a reproducible
  cross-ISA performance ledger.
site_url: !ENV [QUIVER_DOCS_SITE_URL, "https://example.invalid/quiver/"]
repo_url: !ENV [QUIVER_DOCS_REPO_URL, "https://github.com/div0rce/quiver"]

docs_dir: .
site_dir: ../site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: black

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  # REQ-DOC-006: C++ snippets in docs are extracted from tests/ or examples/, never free-typed.
  - pymdownx.snippets:
      base_path: ["..", "."]
      check_paths: true

exclude_docs: |
  mkdocs.yml
  requirements.txt

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn
  anchors: info

nav:
  - Home: README.md
  - Guides:
      - Getting started: guides/getting-started.md
      - Building: guides/building.md
  - API reference:
      - Core types: api/core.md
      - Dispatch: api/dispatch.md
      - K1 compare: api/compare.md
      - K2 filter: api/filter.md
      - K3 sel_convert: api/select.md
      - K4 mask_algebra: api/mask.md
      - K5 take / dict_decode: api/take.md
      - K6 reduce / SMA: api/reduce.md
  - Architecture:
      - Module map: architecture/module-map.md
      - Core (MOD-CORE): architecture/core.md
      - Dispatch (MOD-DISPATCH): architecture/dispatch.md
      - Overview: architecture/README.md
  - Benchmarks:
      - Methodology (QLM-1): benchmarks/methodology.md
      - Running benchmarks: benchmarks/running.md
      - Overview: benchmarks/README.md
  - Testing:
      - Testkit: testing/testkit.md
      - Overview: testing/README.md
  - Internals:
      - CPU detection: internals/cpu-detection.md
      - Dispatch state machine: internals/dispatch-state-machine.md
      - Coding standards: internals/coding-standards.md
  - ADRs: adr/README.md
  - Specifications:
      - Design Charter: design/DESIGN_CHARTER.md
      - Engineering PRD: prd/README.md
  - Releases:
      - Overview: releases/README.md
      - Gate M0: releases/gates/M0.md
      - Gate M1: releases/gates/M1.md
      - Gate M2: releases/gates/M2.md
      - Gate M3: releases/gates/M3.md
      - v0.1.0: releases/v0.1.0.md
